# fidget's math functions on trees, as of fidget a386417, and keycap's,
# which the server registers: their number forms, and functions Rhai has
# for numbers only, or not at all, on trees too.

kind = "math"

[abs]
signatures = ["abs(a: Tree): Tree", "abs(a: Vec2): Vec2", "abs(a: Vec3): Vec3"]
doc = """
The absolute value.

- `a`: a number, a tree or a vector

Of a number, it is Rhai's own `abs`, a number.
Of a vector, it is taken component by component.

On a coordinate, it mirrors: a shape evaluated at `abs(x)` has its +X half copied onto -X.
On a shape's field, it gives a shell of no thickness around the surface, which a number subtracted makes thick.

Notes:
- Field: `abs` of a distance is a distance.

See also: `symmetric_x`, `shell`.

Example: a ring 1 wide, the shell of a circle.
```
abs(circle(10)) - 0.5
```
"""

[sign]
signatures = ["sign(a: Tree): Tree"]
doc = """
The sign of `a`: -1 where it is below 0, 0 where it is 0, and 1 where it is above.

- `a`: a number or a tree

Of a number, it is Rhai's own `sign`, an integer.
On a tree, it is `compare(a, 0)`, whose gradient is 0.

Notes:
- NaN (not a number) gives NaN on a tree, and is an error in Rhai's `sign`.

See also: `abs`, `compare`.

Example: a plate whose top edge steps up and down by 3, with the sign of a wave.
```
rect([60, 20]).intersection(y - 3 * sign(sin(x / 3)))
```
"""

[sqrt]
signatures = ["sqrt(a: Tree): Tree", "sqrt(a: Vec2): Vec2", "sqrt(a: Vec3): Vec3"]
doc = """
The square root.

- `a`: a number, a tree or a vector

Of a vector, it is taken component by component.

Notes:
- NaN (not a number) below 0.

See also: `square`, `cbrt`, `pow`, `hypot`.

Example: a sphere of radius 10, written as its distance from the origin minus 10.
```
sqrt(x * x + y * y + z * z) - 10
```
"""

[cbrt]
signatures = ["cbrt(a: Tree): Tree"]
doc = """
The cube root: the number whose cube is `a`.

- `a`: a number or a tree

Unlike `a ** (1.0 / 3)`, it takes a negative `a`: `cbrt(-8)` is -2.

Notes:
- On a tree, it is the sign of `a` times `exp(ln(abs(a)) / 3)`, and its gradient is 0 where `a` is 0.

See also: `sqrt`, `pow`.

Example: the side of a cube of 1000 cubic mm.
```
cbrt(1000)
```
"""

[square]
signatures = ["square(a: Tree): Tree"]
doc = """
`a` times itself.

- `a`: a number or a tree

See also: `sqrt`, `pow`.

Example: an ellipse 40 by 20, from its implicit equation.
```
square(x / 20) + square(y / 10) - 1
```
"""

[pow]
signatures = ["pow(a: Tree, n: Tree): Tree"]
doc = """
`a` to the power `n`, the same as `a ** n`.

- `a`: the base, a number or a tree
- `n`: the exponent, a number or a tree

Of two numbers, it is Rhai's `**`: of two integers an integer, and a negative `n` is then an error, so write `2.0 ** -1`.
On a tree, a whole `n` multiplies `a` by itself, by repeated squaring, and takes any `a`: `x ** 2` is `square(x)`, and `x ** -1` is `1 / x`.
Any other `n`, or one that is a tree, gives `exp(n * ln(a))`, which takes an `a` above 0: where `a` is 0 or less, the power of a tree is 0, and that of a number below 0 is NaN (not a number).

Notes:
- A negative `n` divides by `a`: where an interval of `a` holds 0, that of the power is NaN, and the preview cannot skip the region.
- An odd `n` is `a` times an even power of it, whose interval is wider than the power's across 0.

See also: `square`, `sqrt`, `cbrt`, `exp`, `ease_in_pow`.

References:
- [Exponentiation by squaring, Wikipedia](https://en.wikipedia.org/wiki/Exponentiation_by_squaring)

Example: a squircle 40 across, from its implicit equation.
```
(x / 20) ** 4 + (y / 20) ** 4 - 1
```
"""

[sin]
signatures = ["sin(a: Tree): Tree"]
doc = """
The sine of an angle in radians.

- `a`: the angle, a number or a tree

See also: `cos`, `tan`, `asin`, `sind`, `PI`.

Example: a plate with a wavy edge.
```
let wave = y - 6 - 2 * sin(x / 3);
max(rect([60, 20]), wave)
```
"""

[cos]
signatures = ["cos(a: Tree): Tree"]
doc = """
The cosine of an angle in radians.

- `a`: the angle, a number or a tree

See also: `sin`, `tan`, `acos`, `cosd`, `PI`.
"""

[tan]
signatures = ["tan(a: Tree): Tree"]
doc = """
The tangent of an angle in radians.

- `a`: the angle, a number or a tree

See also: `sin`, `cos`, `atan`, `tand`, `PI`.
"""

[asin]
signatures = ["asin(a: Tree): Tree"]
doc = """
The arcsine: the angle whose sine is `a`, in radians from -π/2 to π/2.

- `a`: a number or a tree, from -1 to 1

Notes:
- NaN (not a number) outside -1 to 1.

See also: `sin`, `acos`, `atan`, `asind`.
"""

[acos]
signatures = ["acos(a: Tree): Tree"]
doc = """
The arccosine: the angle whose cosine is `a`, in radians from 0 to π.

- `a`: a number or a tree, from -1 to 1

Notes:
- NaN (not a number) outside -1 to 1.

See also: `cos`, `asin`, `atan`, `acosd`.
"""

[atan]
signatures = ["atan(a: Tree): Tree", "atan(y: Tree, x: Tree): Tree"]
doc = """
The arctangent: the angle whose tangent is `a`, in radians from -π/2 to π/2.

- `a`: a number or a tree

For the angle of a point, all the way round, `atan2(y, x)` takes both coordinates; `atan(y, x)` is the same, as Rhai has it.

See also: `tan`, `atan2`, `atand`.
"""

[atan2]
signatures = ["atan2(y: Tree, x: Tree): Tree"]
doc = """
The two-argument arctangent: the angle of the point (`x`, `y`) from +X, in radians from -π to π.

- `y`, `x`: the point's coordinates, `y` first

The angle jumps from π to -π across -X.

See also: `atan`, `atan2d`, `repeat_polar`.

References:
- [atan2, Wikipedia](https://en.wikipedia.org/wiki/Atan2)

Example: a round ramp that climbs from 0 to 10 high once around Z, with a step on -X.
```
let disc = max(circle(20), -z);
max(disc, z - (5 + 5 * atan2(y, x) / PI))
```
"""

[sinh]
signatures = ["sinh(a: Tree): Tree"]
doc = """
The hyperbolic sine: `(exp(a) - exp(-a)) / 2`.

- `a`: a number or a tree

See also: `cosh`, `tanh`, `exp`.
"""

[cosh]
signatures = ["cosh(a: Tree): Tree"]
doc = """
The hyperbolic cosine: `(exp(a) + exp(-a)) / 2`, 1 at 0 and rising on either side.

- `a`: a number or a tree

`c * cosh(x / c)` is a catenary, the curve of a hanging chain.

See also: `sinh`, `tanh`, `exp`.

References:
- [Catenary, Wikipedia](https://en.wikipedia.org/wiki/Catenary)

Example: a plate with a catenary arch cut through it.
```
let arch = y - 30 + 10 * cosh(x / 10);
rect([60, 30], #{anchor: "front"}).difference(arch)
```
"""

[tanh]
signatures = ["tanh(a: Tree): Tree"]
doc = """
The hyperbolic tangent: from -1 to 1, 0 at 0, with a slope of 1 there.

- `a`: a number or a tree

`k * tanh(a / k)` follows `a` near 0 and levels off at -`k` and `k`: a smooth `clamp`.

See also: `clamp`, `sinh`, `cosh`.

Example: a plate whose top edge rises with x near 0 and levels off 5 above and below.
```
rect([60, 30]).intersection(y - 5 * tanh(x / 5))
```
"""

[to_degrees]
signatures = ["to_degrees(a: Tree): Tree"]
doc = """
An angle in radians, in degrees: `a * 180 / PI`.

- `a`: the angle, in radians, a number or a tree

See also: `to_radians`, `atan2d`.

Example: each point's angle about the Z axis, from -180 to 180 degrees, as `atan2d(y, x)` gives it.
```
to_degrees(atan2(y, x))
```
"""

[to_radians]
signatures = ["to_radians(a: Tree): Tree"]
doc = """
An angle in degrees, in radians: `a * PI / 180`.

- `a`: the angle, in degrees, a number or a tree

fidget's `sin`, `cos` and `tan` take radians; the prelude's `sind`, `cosd` and `tand` take degrees.

See also: `to_degrees`, `sind`.

Example: a quarter turn, in radians.
```
to_radians(90)
```
"""

[exp]
signatures = ["exp(a: Tree): Tree"]
doc = """
The exponential function: e, Euler's number, to the power `a`.

- `a`: a number or a tree

See also: `exp2`, `ln`, `pow`, `E`.
"""

[exp2]
signatures = ["exp2(a: Tree): Tree"]
doc = """
2 to the power `a`.

- `a`: a number or a tree

See also: `exp`, `log2`, `pow`.
"""

[ln]
signatures = ["ln(a: Tree): Tree"]
doc = """
The natural logarithm, to base e.

- `a`: a number or a tree, above 0

Notes:
- NaN (not a number) below 0, and minus infinity at 0.

See also: `exp`, `log`, `log2`, `log10`, `LN_2`.
"""

[log]
signatures = ["log(a: Tree): Tree", "log(a: Tree, base: Tree): Tree"]
doc = """
The logarithm to base 10, or to `base`.

- `a`: a number or a tree, above 0
- `base`: the base, above 0 and not 1

`log(a)` is `log10(a)`, as Rhai has it; `ln` is the natural logarithm.

Notes:
- NaN (not a number) below 0, and minus infinity at 0, as for `ln`.

See also: `ln`, `log2`, `log10`.

Example: how many times 3 goes into 81 as a factor.
```
log(81, 3)
```
"""

[log2]
signatures = ["log2(a: Tree): Tree"]
doc = """
The logarithm to base 2.

- `a`: a number or a tree, above 0

Notes:
- NaN (not a number) below 0, and minus infinity at 0, as for `ln`.

See also: `exp2`, `log`, `ln`.
"""

[log10]
signatures = ["log10(a: Tree): Tree"]
doc = """
The logarithm to base 10.

- `a`: a number or a tree, above 0

Notes:
- NaN (not a number) below 0, and minus infinity at 0, as for `ln`.

See also: `log`, `ln`.
"""

[floor]
signatures = ["floor(a: Tree): Tree"]
doc = """
The largest integer not above `a`.

- `a`: a number or a tree

A floor of a coordinate numbers the cells of a grid, for a pattern that changes from cell to cell.

Notes:
- Field: a step at every integer, so a field with `floor` in it is no distance across the steps.

See also: `ceil`, `round`, `rand`.

References:
- [Floor and ceiling functions, Wikipedia](https://en.wikipedia.org/wiki/Floor_and_ceiling_functions)

Example: a staircase, a block whose height steps up by 5 every 8 along X.
```
let wall = cuboid([40, 10, 40], #{anchor: "bottom"});
max(wall, z - 5 * (floor(x / 8) + 4))
```
"""

[ceil]
signatures = ["ceil(a: Tree): Tree"]
doc = """
The ceiling: the smallest integer not below `a`.

- `a`: a number or a tree

Notes:
- Field: a step at every integer, as for `floor`.

See also: `floor`, `round`.

References:
- [Floor and ceiling functions, Wikipedia](https://en.wikipedia.org/wiki/Floor_and_ceiling_functions)

Example: the number of 8 mm cells that covers 30 mm.
```
ceil(30.0 / 8)
```
"""

[round]
signatures = ["round(a: Tree): Tree"]
doc = """
The nearest integer to `a`, halves away from 0.

- `a`: a number or a tree

`x - s * round(x / s)` folds X into cells `s` wide, centred on the multiples of `s`, for a shape repeated along X.

Notes:
- Field: a step halfway between integers, as for `floor`.

See also: `floor`, `ceil`, `repeat`.

References:
- Inigo Quilez, [Domain repetition](https://iquilezles.org/articles/sdfrepetition/)

Example: a plate with a row of holes 10 apart.
```
let strip = rect([70, 12]);
let dot = circle(3).remap(x - 10 * round(x / 10), y, z);
max(strip, -dot)
```
"""
