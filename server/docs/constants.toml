doc = """
fidget's mathematical constants.

- `PI`: π, 3.14159..., half a turn in radians
- `TAU`: τ = 2π, 6.28318..., a full turn in radians
- `E`: Euler's number e, 2.71828...
- `PHI`, `GOLDEN_RATIO`: the golden ratio φ, 1.61803...
- `SQRT_2`: √2, 1.41421...
- `FRAC_1_SQRT_2`: 1/√2, 0.70710...
- `FRAC_PI_2`, `FRAC_PI_3`, `FRAC_PI_4`, `FRAC_PI_6`, `FRAC_PI_8`: π/2, π/3, π/4, π/6 and π/8; 90, 60, 45, 30 and 22.5 degrees in radians
- `FRAC_1_PI`: 1/π, 0.31830...
- `FRAC_2_PI`: 2/π, 0.63661...
- `FRAC_2_SQRT_PI`: 2/√π, 1.12837...
- `LN_2`: the natural logarithm of 2, 0.69314...
- `LN_10`: the natural logarithm of 10, 2.30258...
- `LOG2_E`: the logarithm of e to base 2, 1.44269...
- `LOG10_E`: the logarithm of e to base 10, 0.43429...

In the names, `SQRT` is a square root, `FRAC_a_b` the fraction a/b, `LN` a natural logarithm, and `LOG2` and `LOG10` logarithms to base 2 and 10.
They are Rust's 64-bit constants of the same names.

fidget's transforms take angles in degrees, but its trigonometric functions take radians.
A variable of the same name hides a constant.

Notes:
- There is no `SQRT_3`, although fidget's own documentation lists it.
  `sqrt(3.0)` is the same number.

See also: `sin`, `atan2`, `sind`.

References:
- [Constants in `std::f64::consts`, the Rust standard library](https://doc.rust-lang.org/std/f64/consts/index.html)

Example: the sine of 30 degrees, the angle turned into radians first.
```
sin(30.0 * PI / 180.0)
```
"""
