# fidget's coordinates and constants, as of fidget a386417.

kind = "math"

[x]
signatures = ["x: Tree"]
doc = """
The X coordinate, as a tree: what every shape is built from.

Arithmetic and functions on `x`, `y` and `z` build a tree instead of computing a number.
The tree is evaluated later, at every point the preview or the export asks about.
A shape is such a tree, below 0 inside and above 0 outside.

`x`, `y` and `z` are defined everywhere, inside functions too.
A variable of the same name hides one.

See also: `y`, `z`, `axes`, `remap`.

Example: a circle of radius 10, written as its distance from the origin minus 10.
```
sqrt(x * x + y * y) - 10
```
"""

[y]
signatures = ["y: Tree"]
doc = """
The Y coordinate, as a tree.

See also: `x`, `z`.
"""

[z]
signatures = ["z: Tree"]
doc = """
The Z coordinate, as a tree.

A shape whose tree has no `z` is the same at every height.
The preview shows such a shape as 2D, in the XY plane.

See also: `x`, `y`.

Example: a sphere cut flat at z = 4, its field the larger of the sphere's and the height above the cut.
```
max(sphere(10), z - 4)
```
"""

[axes]
signatures = ["axes(): #{ x: Tree, y: Tree, z: Tree }"]
doc = """
The three coordinates in a map.

The map's `x`, `y` and `z` are the same trees as the variables `x`, `y` and `z`.
They stay at hand in a script that uses those names for numbers.

See also: `x`.

Example: a sphere of radius `x`, cut at half its height, where `x` is a number.
```
let x = 12;
let p = axes();
max(sphere(x), p.z - x / 2)
```
"""

