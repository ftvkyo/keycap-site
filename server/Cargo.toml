[package]
name = "keycap-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Render and evaluation server behind keycap, Emacs support for fidget"
authors = ["Rei Stepanenko <rei@ftvkyo.me>"]
license = "MPL-2.0"
repository = "https://tangled.org/rei.gay/keycap"
publish = false

[dependencies]
fidget = { git = "https://github.com/mkeeter/fidget", rev = "a386417c31f7289027e312975aab810ef98c68e1", default-features = false, features = [
    "jit",
    "mesh",
    "raster",
    "rhai",
    "shapes",
    "wgpu",
] }
facet = { version = "0.46", features = ["reflect", "doc"] }
harfrust = "0.15"
heck = "0.5"
i_overlay = "9.1"
kurbo = "0.13"
libc = "0.2"
nalgebra = "0.35"
pollster = "1"
rand = "0.10"
rayon = "1"
# `internals`, for walking scripts' syntax trees, is unstable API, so a
# minor version may break it.
rhai = { version = "~1.27", features = ["sync", "metadata", "internals"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
skrifa = "0.49"
toml = { version = "1", default-features = false, features = ["parse", "serde"] }
usvg = "0.50"

[profile.release]
debug = false
