# SPDX-License-Identifier: GPL-3.0-or-later
#
# Build the site and publish it to GitHub's gh-pages branch, which GitHub
# Pages serves as it is ("Deploy from a branch", gh-pages, / (root)).
#
# gh-pages is one orphan commit, replaced on every publish. The build is
# reproducible and the commit's names and dates are fixed, so the same source
# makes the same commit, and only changed files are uploaded. Runs on the
# spindle at spindle.rei.gay, with the GITHUB_MIRROR_TOKEN secret that
# mirror.yml uses.
#
# Set up once: in the GitHub repository's settings, Pages deployed from
# gh-pages, with the custom domain keycap.rei.gay; at the DNS host of
# rei.gay, a CNAME from keycap to <owner>.github.io, and rei.gay verified in
# the account's Pages settings (a TXT record), so that no other account can
# claim it; then "Enforce HTTPS".
when:
  - event: push
    branch: main
  - event: manual

engine: microvm
image: alpine-large

environment:
  GITHUB_REPO: ftvkyo/keycap
  # the image's Nix runs as a daemon
  NIX_REMOTE: daemon

# The renders of the last build: only the frames whose inputs changed are
# rendered again, and the cache keeps just what this build used.
# keycap-server, which cache.nixos.org does not have, is kept as an export
# of its closure, built again when a pin changes.
cache:
  - key: frames
    paths:
      - .frame-cache
  - key: keycap-server
    hash:
      - npins/sources.json
      - server/Cargo.lock
    paths:
      - .keycap-server

steps:
  - name: Build
    command: |
      set -euo pipefail
      if [ -e .keycap-server/closure ]; then
        nix-store --import < .keycap-server/closure > /dev/null
      fi
      mkdir -p .frame-cache
      # site/ itself, which takes the frameCache; the root takes no arguments.
      nix-build site -A all --arg frameCache "$PWD/.frame-cache" -o /workspace/site
      rm -rf .frame-cache
      # BusyBox's cp, so plain -r, then the store's read-only modes lifted.
      cp -r /workspace/site-cache/. .frame-cache
      chmod -R u+w .frame-cache
      if [ ! -e .keycap-server/closure ]; then
        mkdir -p .keycap-server
        nix-store --export $(nix-store -qR "$(nix-build --no-out-link -A server)") > .keycap-server/closure
      fi

  - name: Publish to gh-pages
    command: |
      set -euo pipefail
      remote="https://github.com/$GITHUB_REPO.git"
      source=$(git rev-parse HEAD)
      export GIT_AUTHOR_NAME=spindle.rei.gay GIT_AUTHOR_EMAIL=spindle@rei.gay
      export GIT_COMMITTER_NAME=spindle.rei.gay GIT_COMMITTER_EMAIL=spindle@rei.gay
      export GIT_AUTHOR_DATE=$(git log -1 --format=%cI) GIT_COMMITTER_DATE=$(git log -1 --format=%cI)

      pages=/workspace/gh-pages
      mkdir "$pages"
      cp -r /workspace/site/. "$pages"
      chmod -R u+w "$pages"
      touch "$pages/.nojekyll"
      echo keycap.rei.gay > "$pages/CNAME"

      cd "$pages"
      git init -q -b gh-pages
      git config credential.helper '!f() { if test "$1" = get; then printf "username=x-access-token\npassword=%s\n" "$GITHUB_MIRROR_TOKEN"; fi; }; f'

      # The current tip, so the push leaves out every object GitHub already has.
      old=
      if git ls-remote --exit-code "$remote" refs/heads/gh-pages > /dev/null; then
        git fetch -q --depth 1 "$remote" gh-pages
        old=$(git rev-parse FETCH_HEAD)
      fi

      git add -A
      tree=$(git write-tree)
      if [ -n "$old" ] && [ "$tree" = "$(git rev-parse "$old^{tree}")" ]; then
        echo "gh-pages already has this site"
        exit 0
      fi

      commit=$(git commit-tree "$tree" -m "keycap site at $source")
      git push --force "$remote" "$commit:refs/heads/gh-pages"
