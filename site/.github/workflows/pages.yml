# SPDX-License-Identifier: GPL-3.0-or-later
#
# Build the site and publish it with GitHub Pages.
#
# The GitHub repository is a mirror of the knot one, pushed to after every
# push to the knot, so this file lives in the site as
# .github/workflows/pages.yml. Set Pages' source to "GitHub Actions" and its
# custom domain in the GitHub repository's settings.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix-build
      # The store path is read-only and full of symlinks; Pages wants plain files.
      - run: cp -rL result public
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
